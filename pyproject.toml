[project]
name = "afds"
version = "1.0.0"
description = "Hardware-first adulterated fruit detection and sorting system"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
